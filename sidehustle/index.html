<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Side Hustle Pathfinder</title>
  <script src="../../framework.js"></script>
  <style>
    /* Pathfinder-specific styles (framework CSS already loaded) */
  </style>
</head>
<body>
  <div class="ctr">
    <!-- Header built dynamically -->
    <div id="header-container"></div>

    <!-- Tab navigation -->
    <div class="tabs">
      <button class="tb on" onclick="go('discover')">Discover</button>
      <button class="tb" onclick="go('hustles')">Side Hustles</button>
      <button class="tb" onclick="go('earnings')">Earnings</button>
      <button class="tb" onclick="go('insights')">Insights</button>
      <button class="tb" onclick="go('deepdive')">Deep Dive</button>
      <button class="tb" onclick="go('resources')">Resources</button>
    </div>

    <!-- Discover tab (selectors) -->
    <div class="pan on" id="discover">
      <div class="bg">
        <div></div>
        <button class="btn br" onclick="startOver()">Reset</button>
        <button class="btn bp pos-right" onclick="go('hustles')">Next</button>
      </div>
    </div>

    <!-- Side Hustles tab -->
    <div class="pan" id="hustles"></div>

    <!-- Earnings Breakdown tab -->
    <div class="pan" id="earnings"></div>

    <!-- Insights tab -->
    <div class="pan" id="insights"></div>

    <!-- Deep Dive tab -->
    <div class="pan" id="deepdive"></div>

    <!-- Resources tab -->
    <div class="pan" id="resources"></div>
  </div>

  <script src="config.js"></script>
  <script src="helpers.js"></script>
  <script src="renderers.js"></script>
  <script>
    // Initialize pathfinder once all scripts are loaded
    async function initPathfinder() {
      const config = window.PATHFINDER_CONFIG;
      if (!config) return;

      try {
        // 1. Load all data files
        for (const [key, file] of Object.entries(config.dataSources)) {
          await loadDataFile({
            name: key,
            path: `data/${file}`,
            onSuccess: null
          });
        }
        console.log('✓ Data loaded:', { SELECTOR_OPTIONS: window.SELECTOR_OPTIONS, SIDEHUSTLES: !!window.SIDEHUSTLES, INSIGHTS: !!window.INSIGHTS });

        // 2. Build header
        if (config.header) {
          await buildHeader(config.header);
          initHdrCarousel();
          console.log('✓ Header built');
        }

        // 3. Build discover selectors (creates containers with data-q attributes)
        if (config.selectors && window.buildSelectors) {
          await buildSelectors(config.selectors);
          console.log('✓ Selectors built');

          // Small delay to let DOM settle
          await new Promise(r => setTimeout(r, 100));

          // 4. Now populate selector pills
          if (window.renderDiscoverySelectorOptions) {
            renderDiscoverySelectorOptions();
            console.log('✓ Selector options rendered');
          }

          // 5. Style pills based on state
          if (window.renderDiscoveryPills) {
            renderDiscoveryPills();
            console.log('✓ Discovery pills styled');
          }
        }

        // 6. Load saved state
        if (window.loadState) {
          loadState();
          console.log('✓ State loaded');
        }

      } catch (error) {
        console.error('Initialization failed:', error);
      }
    }

    // Start when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPathfinder);
    } else {
      initPathfinder();
    }
  </script>
</body>
</html>
