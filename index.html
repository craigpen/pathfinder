<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pathfinder</title>
<script>
  // Router: Redirect to pathfinder based on URL hash or default to university
  const pathfinder = window.location.hash.substring(1) || 'university';
  // Use relative redirect to stay on localhost if local
  const redirectUrl = window.location.protocol === 'https:' && window.location.hostname.includes('github.io')
    ? `https://craigpen.github.io/pathfinder/${pathfinder}/`
    : `${pathfinder}/`;
  window.location.href = redirectUrl;
</script>
</head>
<body>
  <p>Loading pathfinder...</p>
</body>
</html>
