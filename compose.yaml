services:
  web:
    image: nginx:alpine
    container_name: dev-pathfinder
    restart: unless-stopped
    ports:
      - "3601:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    networks:
      - dev-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dev-net"
      - "traefik.http.routers.pathfinder.rule=Host(`pathfinder.localhost`) || Host(`pathfinder`)"
      - "traefik.http.services.pathfinder.loadbalancer.server.port=80"

networks:
  dev-net:
    name: dev-net
    external: true
