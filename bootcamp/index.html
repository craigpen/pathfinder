<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bootcamp Pathfinder</title>
  <script src="../framework.js"></script>
  <style>
    /* Framework CSS is injected by framework.js */
  </style>
</head>
<body>
  <div class="ctr">
    <!-- Header is built dynamically -->
    <div id="header-container"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tb on" onclick="go('discover')">Discover</button>
      <button class="tb" onclick="go('bootcamps')">Bootcamps</button>
    </div>

    <!-- Discover Tab -->
    <div class="pan on" id="discover">
      <!-- Discovery selectors are built dynamically -->
      <div class="bg">
        <span class="pos-left"></span>
        <button class="btn br pos-center" onclick="startOver()">Reset</button>
        <button class="btn bp pos-right" onclick="go('bootcamps')">Next</button>
      </div>
    </div>

    <!-- Bootcamps Tab -->
    <div class="pan" id="bootcamps">
      <div id="bootcamps-content">
        <div class="qb"><div class="qt">Bootcamps matching your preferences</div></div>
        <div id="bootcamps-list"></div>
      </div>
      <div class="bg">
        <button class="btn bs pos-left" onclick="go('discover')">Back</button>
        <button class="btn br pos-center" onclick="startOver()">Reset</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="helpers.js"></script>
</body>
</html>
